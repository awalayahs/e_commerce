<!DOCTYPE html>
<html>
<head>
    <title>Home | Jodi Enterprise</title>
    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Quicksand', sans-serif;
        }

        .slideshow {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .slide.active {
            opacity: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .slide-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            max-width: 700px;
        }

        .slide-content h1 {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .slide-content p {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 2rem;
        }

        .slide-content a {
            background-color: #06b6d4; /* cyan-500 */
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            transition: background-color 0.3s ease;
            text-decoration: none;
        }

        .slide-content a:hover {
            background-color: #0891b2; /* cyan-600 */
        }
    </style>
</head>
<body>
    {% include 'layout/navbar.html' %}

    <div class="slideshow">
        <!-- Slides -->
        <div class="slide active" style="background-image: url('{% static 'images/index_image.png' %}');"></div>
        <div class="slide" style="background-image: url('{% static 'images/back.jpg' %}');"></div>
        <div class="slide" style="background-image: url('{% static 'images/background.jpg' %}');"></div>
        <div class="slide" style="background-image: url('{% static 'images/laptop.jpg' %}');"></div>

        <!-- Overlay -->
        <div class="overlay"></div>

        <!-- Content -->
        <div class="slide-content">
            <h1>Welcome to Jodi Enterprise</h1>
            <p>
                We provide a wide range of products and services at competitive prices. Explore our catalog and discover everything we have to offer.
            </p>
            <a href="{% url 'login' %}">Login</a>
        </div>
    </div>

    <script>
        const slides = document.querySelectorAll('.slide');
        let current = 0;

        function nextSlide() {
            slides[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
        }

        setInterval(nextSlide, 5000); // Change slide every 5 seconds
    </script>
</body>
</html>
