<!DOCTYPE html>
<html>
<head>
    <title>Members List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body style="font-family: 'Quicksand', sans-serif;">
    {% include 'layout/navbar.html' %}
    
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold mb-6">Registered Members</h1>
        
        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border border-gray-300">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">First Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                     
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    {% for member in members %}
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap">{{ member.id }}</td>
                        <td class="px-6 py-4 whitespace-nowrap">{{ member.first_name }}</td>
                        <td class="px-6 py-4 whitespace-nowrap">{{ member.last_name }}</td>
                        <td class="px-6 py-4 whitespace-nowrap">{{ member.email }}</td>
                      
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="5" class="px-6 py-4 text-center">No members registered yet</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
