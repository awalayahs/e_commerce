<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sign Up | Jodi Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    style="font-family: &quot;Quicksand&quot;, sans-serif"
    class="bg-gradient-to-r from-sky-100 to-sky-300 min-h-screen flex flex-col"
  >
    {% include 'layout/navbar.html' %}

    <div class="flex justify-center items-center flex-grow">
      <div
        class="bg-white shadow-lg rounded-2xl px-8 py-10 w-full max-w-md border border-gray-100"
      >
        <br />
        <br />
        <h1 class="text-3xl font-bold text-center text-sky-600 mb-6">
          Create Account ✨
        </h1>
        <p class="text-center text-gray-500 mb-6">
          Join Jodi Enterprise and start shopping smarter!
        </p>

        {% if messages %}
        <div class="mb-4">
          {% for message in messages %}
          <div
            class="p-3 text-sm {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %} rounded-md text-center"
          >
            {{ message }}
          </div>
          {% endfor %}
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
          {% csrf_token %}
          <div>
            <label
              for="first_name"
              class="block text-sm font-medium text-gray-600 mb-1"
              >First Name</label
            >
            <input
              type="text"
              name="first_name"
              id="first_name"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-400"
              placeholder="Enter your first name"
              required
            />
          </div>

          <div>
            <label
              for="last_name"
              class="block text-sm font-medium text-gray-600 mb-1"
              >Last Name</label
            >
            <input
              type="text"
              name="last_name"
              id="last_name"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-400"
              placeholder="Enter your last name"
              required
            />
          </div>

          <div>
            <label
              for="email"
              class="block text-sm font-medium text-gray-600 mb-1"
              >Email</label
            >
            <input
              type="email"
              name="email"
              id="email"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-400"
              placeholder="Enter your email"
              required
            />
          </div>

          <div>
            <label
              for="password"
              class="block text-sm font-medium text-gray-600 mb-1"
              >Password</label
            >
            <input
              type="password"
              name="password"
              id="password"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-400"
              placeholder="Create a strong password"
              required
            />
          </div>

          <button
            type="submit"
            class="w-full bg-sky-500 text-white font-semibold py-2 rounded-lg hover:bg-sky-600 transition duration-200 shadow-md"
          >
            Sign Up
          </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
          Already have an account?
          <a
            href="{% url 'login' %}"
            class="text-sky-600 hover:text-sky-800 font-semibold"
            >Login</a
          >
        </p>
      </div>
    </div>
  </body>
</html>
